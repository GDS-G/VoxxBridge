name: Python CI

on:
  workflow_call:
  push:
    paths:
      - "voxbridge-gateway/**"
      - "voxbridge-plugin/**"
      - "README.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "voxbridge-gateway/**"
      - "voxbridge-plugin/**"
      - "README.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: voxbridge-gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: voxbridge-gateway/pyproject.toml

      - name: Set up Node.js
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: voxbridge-gateway/web/package-lock.json

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Validate MCP App bundle
        if: matrix.python-version == '3.12'
        run: |
          npm --prefix web ci
          npm --prefix web run check
          git diff --exit-code -- src/voxbridge/ui/audio-delivery-v1.html

      - name: Validate plugin source
        run: |
          python -m json.tool ../voxbridge-plugin/plugin.json > /dev/null
          python -m json.tool ../voxbridge-plugin/.codex-plugin/plugin.json > /dev/null
          python -m json.tool ../voxbridge-plugin/.app.json > /dev/null
          test -f ../voxbridge-plugin/skills/voice-generation/SKILL.md
          test -f ../voxbridge-plugin/skills/music-generation/SKILL.md
          test -f ../voxbridge-plugin/skills/sound-effect-generation/SKILL.md
          python - <<'PY'
          import json
          from pathlib import Path

          root = json.loads(Path("../voxbridge-plugin/plugin.json").read_text())
          legacy = json.loads(
              Path("../voxbridge-plugin/.codex-plugin/plugin.json").read_text()
          )
          app = json.loads(Path("../voxbridge-plugin/.app.json").read_text())
          for field in ("name", "version", "description", "author", "keywords"):
              assert root[field] == legacy[field], field
          assert root["extensions"]["com.openai"]["interface"] == legacy["interface"]
          interface = root["extensions"]["com.openai"]["interface"]
          assert len(interface["shortDescription"]) <= 30
          assert isinstance(interface["defaultPrompt"], list)
          assert 1 <= len(interface["defaultPrompt"]) <= 3
          assert root["extensions"]["com.openai"]["apps"] == "./.app.json"
          assert legacy["apps"] == "./.app.json"
          assert app == {
              "apps": {
                  "dev-6abc243bda748191a4195fb818ade81f": {
                      "id": "asdk_app_6abc243bda748191a4195fb818ade81f",
                      "required": True,
                  }
              }
          }
          PY

      - name: Smoke-test Streamable HTTP MCP
        if: matrix.python-version == '3.12'
        run: |
          voxbridge &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null
          python scripts/smoke_mcp.py

      - name: Build source and wheel distributions
        if: matrix.python-version == '3.12'
        run: python -m build
